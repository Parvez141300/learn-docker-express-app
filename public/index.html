<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="card">
        <h1>Create account</h1>
        <div class="subhead">Join us — it only takes a minute.</div>

        <form action="/sign-up" method="post">
            <div class="field">
                <label for="fullname">Full name</label>
                <input type="text" id="fullname" name="fullname" placeholder="e.g. Alex Rivera" required
                    autocomplete="name">
            </div>

            <div class="field">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="alex@example.com" required
                    autocomplete="email">
                <div class="hint">We'll never share your email.</div>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a strong password" required
                    minlength="6" autocomplete="new-password">
                <div class="hint">At least 6 characters.</div>
            </div>

            <div class="field">
                <label for="confirm_password">Confirm password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter password"
                    required autocomplete="off">
            </div>

            <button type="submit">
                <span>Sign up</span>
                <span class="arrow">→</span>
            </button>
        </form>
    </div>
</body>

</html>
